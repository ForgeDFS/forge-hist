name: relaywatch
# (2026-11-25, Drew: Sunday-Tuesday must not depend on a Claude session) Watchdog for the relay chain: one copy always waiting (4-hour
# copies, each restarts the next). Every 5 min: if relay.yml has no run in progress or queued and its last run started 35+ min ago
# (14:00-04:59 UTC) or 75+ min ago (overnight), start one. Prints times only.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/relaywatch_now"]
concurrency: { group: relaywatch, cancel-in-progress: true }
permissions: { actions: write, contents: read }
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - env: { GH_TOKEN: "${{ github.token }}", R: "${{ github.repository }}" }
        run: |
          set +e; END=$(( $(date +%s) + 235*60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            ACT=$(gh run list -R "$R" -w relay.yml -L 5 --json status -q '[.[]|select(.status!="completed")]|length' 2>/dev/null)
            L=$(gh run list -R "$R" -w relay.yml -L 1 --json createdAt -q '.[0].createdAt' 2>/dev/null)
            A=$(( $(date -u +%s) - $(date -u -d "${L:-1970-01-01T00:00:00Z}" +%s) )); H=$((10#$(date -u +%H)))
            LIM=2100; [ $H -ge 5 ] && [ $H -lt 14 ] && LIM=4500
            if [ "${ACT:-1}" = "0" ] && [ "$A" -ge "$LIM" ]; then
              gh api -X POST "repos/$R/actions/workflows/relay.yml/dispatches" -f ref=main -f "inputs[mode]=drop" > /dev/null && echo "$(date -u +%H:%MZ) relay restarted (last start ${A}s ago)"
            fi
            sleep 300
          done
          gh api -X POST "repos/$R/actions/workflows/relaywatch.yml/dispatches" -f ref=main > /dev/null && echo "next copy started"
