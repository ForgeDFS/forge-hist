name: relay
# Runs the private site updater on free public-repo minutes. Nothing is printed: all output stays in the private repo.
on:
  schedule:
    - cron: "5 14,17,20 * * *"              # full refresh
    - cron: "5,20,35,50 15-23 * * *"        # lock checks (only due ones do work)
    - cron: "5,20,35,50 0-4 * * *"
    - cron: "35,50 11-13 * * 0"
  workflow_dispatch:
    inputs:
      mode: { description: "drop or tick", default: "drop" }
  push:
    branches: [main]
    paths: [".github/relay_now"]   # (2026-11-25) Claude commits this to restart the chain (one full refresh)
concurrency: { group: relay, cancel-in-progress: false }
permissions: { contents: read, actions: write }
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: run
        env:
          GH_TOKEN: ${{ secrets.FORGE_OS_TOKEN }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          EV: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          IN_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "secret FORGE_OS_TOKEN not set"; exit 0; fi
          MODE=tick; [ "$EV" = "workflow_dispatch" ] && MODE="${IN_MODE:-drop}"; [ "$EV" = "push" ] && MODE=drop; [ "$SCHED" = "5 14,17,20 * * *" ] && MODE=drop
          H=$(date -u +%H); M=$(date -u +%M); case "$H" in 14|17|20) [ $((10#$M)) -lt 15 ] && MODE=drop;; esac   # chained runs do the full refreshes too
          {
            git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/ForgeDFS/forge-os.git" fo
            git clone -q --depth 1 --filter=blob:none --sparse https://github.com/ForgeDFS/forge-hist fh && git -C fh sparse-checkout set data/live
            cd fo && FORGE_HIST_DIR="$GITHUB_WORKSPACE/fh" bash tools/pulse_run.sh "$MODE"
          } > /dev/null 2>&1 || true
          echo done
      - name: next
        # GitHub's cron is unreliable for new workflows: each run starts the next one at the next :05/:20/:35/:50 (14:00-04:59 UTC)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set +e   # (2026-11-25) a failing helper call above must never stop the hand-off at the bottom (chain broke 11/25 16:20 UTC)
          # (2026-11-18) NBA Classic nightly self-check (forge-os tools/nba_shape_pick.py run): once a day after 15 UTC, if not run in 20 h
          if [ $((10#$(date -u +%H))) -ge 15 ]; then N=$(gh run list -R "${{ github.repository }}" -w research_matrix.yml -L 20 --json createdAt,displayTitle -q '[.[]|select(.createdAt > "'"$(date -u -d '20 hours ago' +%FT%TZ)"'")]|length' 2>/dev/null || echo 1)
            if [ "${N:-1}" = "0" ]; then gh api -X POST "repos/${{ github.repository }}/actions/workflows/research_matrix.yml/dispatches" -f ref=main -f "inputs[cmd]=python3 tools/nba_shape_pick.py run" -f "inputs[shards]=1" > /dev/null && echo "nba self-check started"; fi; fi
          # (2026-11-20; fixed 11-21) morning report ("Last night" tab): between 07 and 16 UTC, start morning.yml unless it has already run since 07:00 UTC today
          # (the old "not run in 18 h" test skipped 11/21 because a manual run at 20:53 UTC the day before was too recent; mom saw nothing until 10:24 ET)
          H0=$((10#$(date -u +%H))); if [ $H0 -ge 7 ] && [ $H0 -lt 16 ]; then L0=$(gh run list -R "${{ github.repository }}" -w morning.yml -L 1 --json createdAt -q '.[0].createdAt' 2>/dev/null)
            if [ "$(date -u -d "${L0:-1970-01-01T00:00:00Z}" +%s)" -lt "$(date -u -d "$(date -u +%F)T07:00:00Z" +%s)" ]; then gh api -X POST "repos/${{ github.repository }}/actions/workflows/morning.yml/dispatches" -f ref=main > /dev/null && echo "morning started"; fi; fi
          # (2026-11-18) live.yml (DK + odds capture) also misses its cron: start it whenever its last run is 2+ h old
          L=$(gh run list -R "${{ github.repository }}" -w live.yml -L 1 --json createdAt -q '.[0].createdAt' 2>/dev/null); A=$(( $(date -u +%s) - $(date -u -d "${L:-1970-01-01T00:00:00Z}" +%s) ))
          if [ "$A" -ge 7000 ]; then gh api -X POST "repos/${{ github.repository }}/actions/workflows/live.yml/dispatches" -f ref=main > /dev/null && echo "live started (last ${A}s ago)"; fi
          H=$(date -u +%H); if [ $((10#$H)) -ge 5 ] && [ $((10#$H)) -lt 14 ]; then sleep 3000; gh api -X POST "repos/${{ github.repository }}/actions/workflows/relay.yml/dispatches" -f ref=main -f "inputs[mode]=tick" > /dev/null && echo next-overnight; exit 0; fi   # (2026-11-16) keep the chain alive overnight (hourly) -- cron alone left it dead 05:39-22:15 UTC
          M=$(date -u +%M); S=$(date -u +%S); for t in 5 20 35 50 65; do if [ $((10#$M)) -lt $t ]; then W=$(( (t - 10#$M) * 60 - 10#$S )); break; fi; done
          [ "$W" -gt 0 ] && sleep "$W"
          for i in 1 2 3 4 5; do gh api -X POST "repos/${{ github.repository }}/actions/workflows/relay.yml/dispatches" -f ref=main -f "inputs[mode]=tick" > /dev/null && { echo next; exit 0; }; sleep 20; done   # (2026-11-25) one failed hand-off broke the chain at 16:20 UTC
          exit 1
