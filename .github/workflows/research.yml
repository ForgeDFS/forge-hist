name: research
# Runs a long private backtest on free public-repo minutes. Nothing is printed; results go to the private repo.
on:
  workflow_dispatch:
    inputs:
      cmd: { description: "command (run from the private repo root)", required: true }
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: run
        env: { GH_TOKEN: "${{ secrets.FORGE_OS_TOKEN }}", CMD: "${{ github.event.inputs.cmd }}" }
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "secret missing"; exit 0; fi
          { git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/ForgeDFS/forge-os.git" fo && cd fo && bash tools/research_run.sh "$CMD"; } > /dev/null 2>&1 || true
          echo done
